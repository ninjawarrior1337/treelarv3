allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  # Repository form, not a commit: approves any commit, so bumping the mei
  # dependency doesn't require re-approving its build scripts in CI.
  mei@git+https://github.com/ninjawarrior1337/mei.git: true
  sharp: true
  svelte-preprocess: true
